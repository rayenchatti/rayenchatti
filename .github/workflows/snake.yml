name: Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#4a6a9e&color_dots=#ebedf0,#c9d4e5,#9fb2d0,#6F8BB8,#3e5a88
            dist/snake-dark.svg?palette=github-dark&color_snake=#D4FF3A&color_dots=#0f1b33,#1d2f52,#34507d,#6F8BB8,#B9C7DD

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
