<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340" role="img" aria-label="LifePass: Medical records shared through a personal QR code. 1ST PRIZE, DevHeist.">
  <style>
    text { font-family: 'Fira Code', 'JetBrains Mono', Consolas, 'Courier New', monospace; }
    .big { font-family: 'Segoe UI', Inter, Ubuntu, Arial, sans-serif; font-weight: 900; }
    @keyframes in { to { opacity: 1 } }

    .name { fill: #ECE8DF; font-size: 34px; }
    .desc { fill: #B9C7DD; font-size: 15px; }
    .rank { fill: #D4FF3A; font-size: 16px; font-weight: 800; letter-spacing: 1px; }
    .event { fill: #8193b3; font-size: 15px; }
    .chip { fill: #B9C7DD; font-size: 13px; }
    .open { fill: #8193b3; font-size: 13px; }
    .bob { animation: bob 3.6s ease-in-out infinite; }
    @keyframes bob { 50% { transform: translateY(-12px) } }
    .pillar { animation: pulse 2.8s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { transform: scaleY(1) } 25% { transform: scaleY(2.1) } 50% { transform: scaleY(1) } }
    .syn { stroke: #6F8BB8; stroke-opacity: .45; stroke-width: 1.2; }
    .node { animation: fire 1.6s ease-in-out infinite; }
    @keyframes fire { 0%, 100% { opacity: .55 } 30% { opacity: 1 } }
    .pin { opacity: 0; animation: drop 3s cubic-bezier(.3,1.6,.5,1) infinite; }
    @keyframes drop { 0% { opacity: 0; transform: translateY(-30px) } 15%, 85% { opacity: 1; transform: none } 100% { opacity: 0 } }
    .slide { animation: slide 4s ease-in-out infinite; }
    @keyframes slide { 50% { transform: translate(-10px, -8px) } }
    .reveal { opacity: 0; animation: in .6s forwards; }
  </style>
  <polygon points="0,12 12,0 600,0 600,328 588,340 0,340" fill="#1d2f52"/><rect x="0" y="12" width="588" height="328" fill="#0A1222" stroke="#6F8BB8" stroke-opacity=".6"/>
  <g class="reveal" style="animation-delay:.1s">
    <text x="34" y="82" class="big name">LifePass</text>
    <text x="34" y="128" class="desc">Medical records shared through</text><text x="34" y="152" class="desc">a personal QR code.</text>
  </g>
  <g class="reveal" style="animation-delay:.4s">
    <rect x="34" y="214" width="4" height="34" fill="#D4FF3A"/>
    <text x="50" y="228" class="rank">1ST PRIZE</text>
    <text x="50" y="246" class="event">DevHeist</text>
  </g>
  <g class="reveal" style="animation-delay:.6s"><rect x="34" y="270" width="59" height="30" fill="#0d1830" stroke="#6F8BB8" stroke-opacity=".5"/><text x="64" y="290" text-anchor="middle" class="chip">React</text><rect x="101.0" y="270" width="85" height="30" fill="#0d1830" stroke="#6F8BB8" stroke-opacity=".5"/><text x="143" y="290" text-anchor="middle" class="chip">Tailwind</text><rect x="193.8" y="270" width="128" height="30" fill="#0d1830" stroke="#6F8BB8" stroke-opacity=".5"/><text x="258" y="290" text-anchor="middle" class="chip">Framer Motion</text></g>
  <text x="560" y="56" text-anchor="end" class="open">open repo -&gt;</text>
  
