  </g>
  <g class="reveal" style="animation-delay:.4s">
    <rect x="34" y="214" width="4" height="34" fill="#D4FF3A"/>
    <text x="50" y="228" class="rank">TOP 5 / 30</text>
    <text x="50" y="246" class="event">HACK4UCAR 2025</text>
  </g>
